name: CS Launcher Plus CI

# Builds on every push; auto-publishes the rolling "latest" prerelease from main
# and a proper GitHub Release for every v* tag - no manual upload, no signing
# secrets, no Play Store steps needed.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Optional: set these repo secrets to also produce a signed release APK.
      # Without them the step is skipped and only the debug build is published.
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      CSPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_cs/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_cs/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create out directory
        run: mkdir out

      - name: Fetch Virtual LAN tunnel engine (EasyTier)
        run: bash scripts/fetch_easytier.sh

      - name: Build Debug .apk
        run: |
          gradle :app_cs:assembleFullDebug
          mv app_cs/build/outputs/apk/full/debug/app_cs-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_cs:assembleNoruntimeDebug
          mv app_cs/build/outputs/apk/noruntime/debug/app_cs-noruntime-debug.apk out/app-debug-noruntime.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Decode release keystores (only if secrets configured)
        if: env.CSPUB_KEYSTORE_PASSWORD != ''
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app_cs/cs_upload_next.jks
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app_cs/cs_release_next.jks
          fi

      - name: Build Release .apk (signed, optional)
        if: env.CSPUB_KEYSTORE_PASSWORD != ''
        run: |
          gradle :app_cs:assembleFullPubRelease
          mv app_cs/build/outputs/apk/full/pubRelease/app_cs-full-pubRelease.apk out/CS Launcher Plus-release.apk
          md5sum "out/CS Launcher Plus-release.apk" > out/CS Launcher Plus-release.md5

      - name: Publish rolling latest build (main branch)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CS Launcher Plus 1.4 - latest build
          prerelease: true
          body: |
            Automated build of @{{ github.sha }}
            Built by GitHub Actions - no manual upload needed.
            app-debug-full.apk is the one to install (includes the Java runtime).
          files: |
            out/app-debug-full.apk
            out/app-debug-full.md5
            out/app-debug-noruntime.apk
            out/app-debug-noruntime.md5
            out/CS Launcher Plus-release.apk
            out/CS Launcher Plus-release.md5
          fail_on_unmatched_files: false

      - name: Release tagged build (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CS Launcher Plus ${{ github.ref_name }}
          body: |
            Release build of @{{ github.sha }}
            Install app-debug-full.apk.
          files: |
            out/app-debug-full.apk
            out/app-debug-full.md5
            out/app-debug-noruntime.apk
            out/app-debug-noruntime.md5
            out/CS Launcher Plus-release.apk
            out/CS Launcher Plus-release.md5
          fail_on_unmatched_files: false
